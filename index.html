const seedLot=r=>({date:r[0],supplier:r[1],kg:r[2],loco:r[3],price:r[4],pd:r[5],fix:r[6],frt:r[7],inv:r[8],piRec:r[9],m:r[10],ciNo:r[11],ciRec:r[12],arrived:r[13],logistic:r[14],mawb:r[15],type:r[16],brands:r[17],src:"IMPORT"});

function freshState(){const s={v:3,lots:[],moves:[],bars:[],rules:{}};SEED.forEach(r=>addLot(s,seedLot(r)));return s}
function addLot(s,l){
  l.id=uid("L");l.by??=who(); s.lots.push(l);
  for(const [b,kg] of Object.entries(l.brands)) if(kg>0)
    s.moves.push({by:l.by,id:uid("M"),kind:"IN",date:l.arrived||l.date,brand:b,kg:+kg,from:null,to:"MAIN",ref:l.inv,lotId:l.id,serials:[],note:l.supplier});
}
function migrate(s){
  if(!s.v||s.v<2){
    const loc=l=>l==="VAULT"?"VAULTING":(l&&l.startsWith("CO:"))?"SG":l;
    s.moves.forEach(m=>{m.from=loc(m.from);m.to=loc(m.to);if(m.kind==="VAULT")m.kind="VAULTING";if(m.kind==="TRANSFER")m.kind="SALE"});

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fdate=d=>{if(!d)return"—";const[y,m,dd]=d.split("-");return `${+dd}-${MON[+m-1]}-${y.slice(2)}`};
const today=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
const locName=l=>LOCS[l]||l||"—";
const near=(a,b)=>Math.abs(a-b)<0.02;
function bal(loc,brand){let t=0;for(const m of S.moves){if(brand&&m.brand!==brand)continue;if(m.to===loc)t+=m.kg;if(m.from===loc)t-=m.kg}return r3(t)}
function barsAt(loc,brand){return S.bars.filter(b=>b.loc===loc&&(!brand||b.brand===brand))}
function serialKg(loc,brand){return r3(barsAt(loc,brand).reduce((a,b)=>a+b.kg,0))}
const lotOf=id=>S.lots.find(x=>x.id===id);
const isLBMA=bar=>(lotOf(bar.lotId)?.type||"").toUpperCase()==="LBMA";
const lotLabel=id=>{const l=lotOf(id);return l?`${fdate(l.date)} · ${l.supplier} · ${l.inv}`:"—"};
const locCls=l=>l==="MAIN"?"c-main":l==="VAULTING"?"c-vault":"c-out";
const suppliers=()=>[...new Set(S.lots.map(l=>l.supplier))].sort();
const piIncPD=()=>true; // sheet: L = (G + H) × E for every supplier

// ---------- the formulas ----------
// Oz     = Kg × 32.148
// PI     = Oz × (Price + P/D)            (same as the IMPORT sheet: L = (G + H) × E)
// CI     = Oz × (M + P/D)                 (same as the IMPORT sheet: O = (M + H) × E)
// Landed = Price + P/D + Fixing + Freight (USD/oz); Cost = Oz × Landed
function calc(l){
  const oz=r3(l.kg*OZ),inc=piIncPD(l.supplier);
  const piPer=(+l.price||0)+(inc?(+l.pd||0):0),pi=r2(oz*piPer);
  const ciPer=l.m?(+l.m)+(+l.pd||0):null,ci=ciPer!=null?r2(oz*ciPer):null;
  const landed=l.price?(+l.price)+(+l.pd||0)+(+l.fix||0)+(+l.frt||0):0,cost=r2(oz*landed); // 0.00 until Price PI is entered
  const iss=[];
  const bsum=r3(Object.values(l.brands).reduce((a,b)=>a+ +b,0));
  if(bsum!==r3(+l.kg))iss.push({f:"Brands",sev:"bad",msg:`Brand split totals ${fkg(bsum)} kg but lot Kg is ${fkg(l.kg)} kg`});
  const st=LOCO_STD[l.loco];
  if(st&&(!near(+l.fix||0,st.fix)||!near(+l.frt||0,st.frt)))
    iss.push({f:"Fixing / Freight",sev:"w",msg:`Loco ${l.loco} standard is Fixing ${st.fix.toFixed(2)} / Freight ${st.frt.toFixed(1)}, this lot has ${(+l.fix||0).toFixed(2)} / ${(+l.frt||0).toFixed(1)}`});
  if(l.piRec){const d=r2(l.piRec-pi);if(Math.abs(d)>1){const x=d/oz;
    let h=`PI differs from formula by ${fsign(x)} USD/oz — check the invoice amount`;
    if(inc&&l.pd&&near(x,-l.pd))h=`PI excludes P/D (${fsign(l.pd)})`;
    else if(!inc&&l.pd&&near(x,l.pd))h=`PI already includes P/D`;
    else if(Math.abs(x)>=1&&near(x,Math.round(x)))h=`PI price differs from Price by ${fsign(x)} USD/oz (PI uses ${fusd(l.price+x)}) — check the price`;
    iss.push({f:"PI",sev:"bad",rec:l.piRec,calc:pi,d,x,msg:h})}}
  if(l.ciRec&&ci!=null){const d=r2(l.ciRec-ci);if(Math.abs(d)>1){const x=d/oz;
    let h=`CI differs from formula by ${fsign(x)} USD/oz — check P/D or Price CI`;
    if(near(x,0.1))h="CI is exactly 0.10/oz above formula — check whether Fixing was added";
    else if(l.pd&&near(x,-l.pd))h=`CI excludes P/D (${fsign(l.pd)})`;
    else{const impl=r2(l.ciRec/oz-l.m);h+=` · back-solved P/D used in CI is ${fsign(impl)} (P/D field has ${fsign(+l.pd||0)})`}
    iss.push({f:"CI",sev:"bad",rec:l.ciRec,calc:ci,d,x,msg:h})}}
  return{oz,inc,piPer,pi,ciPer,ci,landed,cost,iss};
}
const allIssues=()=>S.lots.flatMap(l=>calc(l).iss.map(i=>({...i,l})));
// kg-weighted landed cost per oz for a brand, across all received lots
function avgCost(brand){let w=0,t=0;for(const l of S.lots){const k=+l.brands[brand]||0;if(!k)continue;w+=k;t+=k*calc(l).landed}return w?t/w:0}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));

    <div class="kpi vault"><div class="lab">In Vaulting</div><div class="v">${fkg(vlt)} <small>kg</small></div><div class="sm muted">Customer-owned, removed from stock</div></div>

    <tbody>${rows}</tbody>

// ----- stock card (per brand, main stock) -----
let dashOpen=null,adjMsg="";
function stockCard(b){
  const ms=S.moves.filter(m=>m.brand===b&&(m.to==="MAIN"||m.from==="MAIN"))
    .map((m,i)=>({m,i:S.moves.indexOf(m)})).sort((x,y)=>x.m.date.localeCompare(y.m.date)||x.i-y.i).map(x=>x.m);
  let run=0;const sum={IN:0,SALE:0,VAULTING:0,ADJ:0,OTHER:0};
  const rows=ms.map(m=>{const inn=m.to==="MAIN"?m.kg:0,out=m.from==="MAIN"?m.kg:0;run=r3(run+inn-out);
    const k=m.kind in sum?m.kind:"OTHER";sum[k]=r3(sum[k]+(m.kind==="ADJ"?inn-out:inn+out));
    const l=m.lotId&&lotOf(m.lotId);
    const what=m.kind==="IN"?`${esc(l?.supplier||m.note)} · INV ${esc(m.ref)}${l?` · ${esc(l.type)} · P/D ${fsign(+l.pd||0)}`:""}`
      :m.kind==="SALE"?`Sold to ${esc(SG_NAME)}${m.ref?` · Invoice ${esc(m.ref)}`:""}${m.value?` · USD ${fusd(m.value)}`:""}`
      :m.kind==="VAULTING"?`Customer ${esc(m.customer||"—")}${m.ref?` · ${esc(m.ref)}`:""}${m.serials.length?` · ${m.serials.length} bars`:""}`
      :m.kind==="ADJ"?`${esc(m.note||"Stock adjustment")}${m.ref?` · ${esc(m.ref)}`:""}`:esc(m.note||"");
    const act=m.kind==="IN"&&l?`<button type="button" class="btn ghost sm" data-editlot="${l.id}">View lot</button>`
      :`<button type="button" class="btn danger sm" data-undo="${m.id}">${pendingDel===m.id?"Click again to confirm":"Reverse"}</button>`;
    return `<tr><td class="num sm">${fdate(m.date)}</td><td>${moveChip(m)}</td><td class="sm">${what}${m.kind!=="ADJ"&&m.note&&m.kind!=="IN"?`<div class="muted">${esc(m.note)}</div>`:""}</td>
      <td class="r num good">${inn?"+"+fkg(inn):""}</td><td class="r num bad">${out?"−"+fkg(out):""}</td><td class="r num"><b>${fkg(run)}</b></td><td>${act}</td></tr>`}).reverse().join("");
  const unser=r3(bal("MAIN",b)-serialKg("MAIN",b));
  return `<div class="pdd" style="margin-top:0;border-top:0">
   <div class="acts" style="gap:18px;margin-bottom:10px;font-size:13px">
    <span>Received <b class="num good">+${fkg(sum.IN)}</b></span><span>Sold SG <b class="num bad">−${fkg(sum.SALE)}</b></span>
    <span>To Vaulting <b class="num bad">−${fkg(sum.VAULTING)}</b></span><span>Adjusted <b class="num">${fsign(sum.ADJ).replace(".00","")}</b></span>
    <span>Balance <b class="num">${fkg(bal("MAIN",b))} kg</b></span></div>
   <div class="tbl" style="max-height:420px;overflow:auto"><table><thead><tr><th>Date</th><th>Type</th><th>Details</th><th class="r">In kg</th><th class="r">Out kg</th><th class="r">Balance kg</th><th></th></tr></thead>
    <tbody>${rows||`<tr><td colspan="7" class="muted">No movements yet</td></tr>`}</tbody></table></div>
   <form id="adjForm" class="calc" style="display:block;margin-top:12px">
    <b style="font-family:var(--font-body)">Adjust ${esc(b)} stock</b> <span class="sm muted">Use when a physical count differs from the system. A reason is required, and adjustments can be reversed later.</span>
    <div class="row" style="margin-top:8px">
     <label>Date<input type="date" id="aDate" value="${today()}" required></label>
     <label>Direction<select id="aDir"><option value="1">Increase (+)</option><option value="-1">Decrease (−)</option></select></label>
     <label>Weight (kg)<input type="number" step="0.001" min="0" id="aKg" class="num" required></label>
     <label>Document no. (optional)<input id="aRef"></label>
    </div>
    <label>Reason<input id="aNote" required placeholder="e.g. Monthly count found 1 extra bar"></label>
    <div class="acts" style="margin-top:10px"><button class="btn" type="submit">Save adjustment</button><span class="sm muted">Decreases are limited to gold without serials (${fkg(unser)} kg)</span></div>
    ${adjMsg}</form></div>`;
}
function moveChip(m){
  if(m.kind==="ADJ")return m.to==="MAIN"?'<span class="chip c-in">Adjust +</span>':'<span class="chip c-out">Adjust −</span>';
  return {IN:'<span class="chip c-in">Received</span>',VAULTING:'<span class="chip c-vault">To Vaulting</span>',SALE:'<span class="chip c-out">Sold to SG</span>',RETURN:'<span class="chip c-main">Returned to main</span>'}[m.kind]||esc(m.kind);
}
// reverse a movement; refuses when the gold has already moved on
function undoMove(id){
  const m=S.moves.find(x=>x.id===id);if(!m||m.kind==="IN")return"";
  if(m.to&&bal(m.to,m.brand)<m.kg)return `Cannot reverse — the gold at ${locName(m.to)} has already moved on`;
  S.bars.forEach(x=>{if(m.serials.includes(x.serial)&&x.loc===m.to){x.loc=m.from;delete x.customer}});
  S.moves=S.moves.filter(x=>x.id!==id);save();return"";
}
function bindDash(){
  document.getElementById("toCheck")?.addEventListener("click",()=>go("check"));
  app.querySelectorAll(".brow").forEach(r=>{const t=()=>{dashOpen=dashOpen===r.dataset.b?null:r.dataset.b;adjMsg="";pendingDel=null;render()};
    r.addEventListener("click",t);r.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}})});
  app.querySelectorAll("[data-editlot]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();editId=b.dataset.editlot;go("lots")}));
  app.querySelectorAll("[data-undo]").forEach(b=>b.addEventListener("click",()=>{
    if(pendingDel!==b.dataset.undo){pendingDel=b.dataset.undo;render();return}
    const err=undoMove(b.dataset.undo);pendingDel=null;adjMsg=err?`<div class="msg err">${esc(err)}</div>`:'<div class="msg ok">Movement reversed</div>';render()}));
  const f=document.getElementById("adjForm");if(!f)return;
  f.addEventListener("submit",e=>{e.preventDefault();const g=id=>document.getElementById(id),b=dashOpen;
    const dir=+g("aDir").value,kg=r3(+g("aKg").value),note=g("aNote").value.trim();
    const err=t=>{adjMsg=`<div class="msg err">${t}</div>`;render()};
    if(!(kg>0))return err("Enter a weight greater than 0");
    if(!note)return err("Enter a reason for the adjustment");
    if(dir<0&&kg>r3(bal("MAIN",b)-serialKg("MAIN",b)))return err(`You can decrease at most ${fkg(r3(bal("MAIN",b)-serialKg("MAIN",b)))} kg (bars with serials must be handled individually)`);
    S.moves.push({by:who(),id:uid("M"),kind:"ADJ",date:g("aDate").value,brand:b,kg,from:dir<0?"MAIN":null,to:dir>0?"MAIN":null,ref:g("aRef").value.trim(),serials:[],note});
    save();adjMsg=`<div class="msg ok">Saved: ${dir>0?"increased":"decreased"} ${esc(b)} by ${fkg(kg)} kg</div>`;render()});
}
function moveRow(m){
  const who=m.kind==="VAULTING"&&m.customer?` · ${esc(m.customer)}`:m.kind==="ADJ"?` · ${esc(m.note||"")}`:"";
  const path=m.kind==="ADJ"?(m.to?"Adjustment → Main Stock":"Main Stock → Adjustment"):`${m.from?esc(locName(m.from))+" → ":""}${esc(locName(m.to))}`;
  return `<tr><td class="num sm">${fdate(m.date)}</td><td>${moveChip(m)}</td><td>${esc(m.brand)}</td><td class="r num">${fkg(m.kg)}</td><td class="sm muted">${path}${who}</td></tr>`;
}

function pDate(s){s=(s||"").trim();if(!s)return"";const m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[-\/ ](\d{2,4})$/);
  if(m){const mo=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase())+1;let y=+m[3];if(y<100)y+=2000;return `${y}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  const d=new Date(s);return isNaN(d)?"":d.toISOString().slice(0,10)}
const pNum=s=>{const n=parseFloat(String(s??"").replace(/[,\s]/g,""));return isNaN(n)?0:n};
// IMPORT columns: A Done B Payment C Supplier D Kg E Oz F Loco G Price H P/D I Fixing J Freight K INV L PI M Price N INV O CI P Arrived Q Logistic R Remark S MAWB T TYPE U check V–AD brands
function parsePaste(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return{err:"Nothing pasted yet"};
  const lots=[];let bad=0;
  for(const ln of lines){const c=ln.split("\t");
    const date=pDate(c[1]),sup=(c[2]||"").replace(/​/g,"").trim(),kg=pNum(c[3]);
    if(!date||!sup||!kg){bad++;continue}
    const brands={};BNAMES.forEach((b,i)=>{const x=pNum(c[21+i]);if(x>0)brands[b]=x});
    if(!Object.keys(brands).length){bad++;continue}
    lots.push({date,supplier:sup,kg,loco:(c[5]||"").trim(),price:pNum(c[6]),pd:pNum(c[7]),fix:pNum(c[8]),frt:pNum(c[9]),inv:(c[10]||"").trim(),piRec:pNum(c[11]),m:pNum(c[12]),
      ciNo:(c[13]||"").trim(),ciRec:pNum(c[14]),arrived:pDate(c[15]),logistic:(c[16]||"").trim(),mawb:(c[18]||"").trim(),type:(c[19]||"").trim(),brands,src:"PASTE"})}
  if(!lots.length)return{err:"No rows could be read — copy from column A and make sure each row has a date (B), Supplier (C) and Kg (D)"};
  return{lots,bad};
}

function saleCalc(kg,price,pd,cost){
  const oz=r3(kg*OZ),value=price?r2(oz*(price+pd)):0,costUsd=r2(oz*cost),ok=price&&cost;
  return{oz,value,cost,costUsd,margin:ok?r2(value-costUsd):0,marginOz:ok?(price+pd)-cost:0,ok};
}
function bindMove(){
  document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{mvKind=b.dataset.k;render()}));

  const refresh=()=>{

      ?`<p class="sm muted" style="margin:6px 0">${sale?"Select bars sold (optional)":"Select bars for Vaulting — weight is calculated from the selection"}</p><div class="serlist">${bars.map(x=>`<label><input type="checkbox" value="${esc(x.serial)}" data-kg="${x.kg}">${esc(x.serial)}</label>`).join("")}</div>`
      :(sale?"":`<div class="msg err">No ${esc(b)} bars from LBMA lots with serials in main stock — record serials in the Bar Serials tab first</div>`);
    if(!sale)g("mKg").value="";calcVal();
  };
  g("mBrand").addEventListener("change",refresh);
  g("mSerWrap").addEventListener("change",()=>{const s=r3(selected().reduce((a,x)=>a+ +x.dataset.kg,0));
    if(!sale)g("mKg").value=s||"";else if(s>(+g("mKg").value||0))g("mKg").value=s;calcVal()});
  if(sale)["mKg","mPrice","mPd","mCost"].forEach(id=>g(id).addEventListener("input",calcVal));
  refresh();
  g("mvForm").addEventListener("submit",e=>{e.preventDefault();
    const b=g("mBrand").value,kg=r3(+g("mKg").value),msg=g("mvMsg");
    const sels=selected().map(x=>x.value);
    const selKg=r3(S.bars.filter(x=>sels.includes(x.serial)).reduce((a,x)=>a+x.kg,0));
    const avail=bal("MAIN",b),unser=r3(avail-serialKg("MAIN",b));
    if(!sale&&!sels.length)return msg.innerHTML='<div class="msg err">Vaulting requires at least 1 bar selected by serial</div>';
    if(!(kg>0))return msg.innerHTML='<div class="msg err">Enter a weight greater than 0</div>';
    if(kg>avail)return msg.innerHTML=`<div class="msg err">Main stock has only ${fkg(avail)} kg of ${esc(b)}</div>`;
    if(r3(kg-selKg)>unser)return msg.innerHTML=`<div class="msg err">The part without selected serials (${fkg(r3(kg-selKg))} kg) exceeds gold without serials (${fkg(unser)} kg) — select more bars</div>`;
    const to=sale?"SG":"VAULTING";
    const m={by:who(),id:uid("M"),kind:mvKind,date:g("mDate").value,brand:b,kg,from:"MAIN",to,ref:g("mRef").value.trim(),serials:sels,note:g("mNote").value.trim()};
    if(sale){m.price=+g("mPrice").value||0;m.pd=+g("mPd").value||0;m.cost=+g("mCost").value||0;const c=saleCalc(kg,m.price,m.pd,m.cost);m.value=c.value;m.margin=c.ok?c.margin:null}
    else m.customer=g("mCust").value.trim();

async function sha(t){return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))}
async function setPw(u,pw){u.salt=hex(crypto.getRandomValues(new Uint8Array(8)));u.h=await sha(u.salt+pw)}

      <p class="sm muted" style="margin:0">Passwords are kept only in this browser. Resetting removes every user account on this device and restores <b class="num">admin</b> / <b class="num">${DEFAULT_PW}</b>. Stock data is not touched.</p>
      <label>Type RESET to confirm<input id="rcT" autocomplete="off"></label>
      <button class="btn danger" type="submit">Reset sign-in on this device</button><div id="rcMsg"></div></form></details>`);
  document.getElementById("rcForm").addEventListener("submit",async e=>{e.preventDefault();
    if(document.getElementById("rcT").value.trim().toUpperCase()!=="RESET")return document.getElementById("rcMsg").innerHTML='<div class="msg err">Type RESET to confirm.</div>';
    try{localStorage.removeItem(UKEY);localStorage.removeItem(LKEY)}catch(x){}
    await ensureUsers();showLogin(`Sign-in reset. Use admin / ${DEFAULT_PW}.`)});
  document.getElementById("lgForm").addEventListener("submit",async e=>{e.preventDefault();
    const out=document.getElementById("lgMsg"),lk=getLock();
    if(!document.getElementById("lgU").value.trim()||!document.getElementById("lgP").value)return out.innerHTML='<div class="msg err">Enter both your username and password.</div>';
    if(lk.until>Date.now())return out.innerHTML=`<div class="msg err">Too many failed attempts. Try again in ${Math.ceil((lk.until-Date.now())/60e3)} min.</div>`;
    const u=U.find(x=>x.u===document.getElementById("lgU").value.trim().toLowerCase());
    const ok=u&&await sha(u.salt+document.getElementById("lgP").value)===u.h;
    if(!ok){lk.n=(lk.n||0)+1;let t="Wrong username or password.";
      if(lk.n>=5){lk.until=Date.now()+5*60e3;lk.n=0;t+=" Sign-in is locked for 5 minutes."}else t+=` ${5-lk.n} attempts left.`;
      setLock(lk);return out.innerHTML=`<div class="msg err">${t}</div>`}
    setLock({n:0,until:0});me=u;touch();u.must?showSetPw():enter()});
}
function showSetPw(){
  shell(`<form id="pwForm" class="gate-form" novalidate><p style="margin:0 0 4px"><b>Set a new password</b><br><span class="sm muted">Signed in as ${esc(me.name)}. Choose a password of at least 8 characters.</span></p>
    <label>New password<input id="np1" type="password" autocomplete="new-password" required minlength="8"></label>
    <label>Confirm password<input id="np2" type="password" autocomplete="new-password" required minlength="8"></label>
    <button class="btn" type="submit">Save and continue</button><div id="pwMsg"></div></form>`);
  document.getElementById("pwForm").addEventListener("submit",async e=>{e.preventDefault();
    const a=document.getElementById("np1").value,b=document.getElementById("np2").value,out=document.getElementById("pwMsg");
    if(a.length<8)return out.innerHTML='<div class="msg err">Use at least 8 characters.</div>';
    if(a!==b)return out.innerHTML='<div class="msg err">The two passwords do not match.</div>';
    if(a===DEFAULT_PW)return out.innerHTML='<div class="msg err">Choose a password other than the default.</div>';
    await setPw(me,a);me.must=false;saveUsers();enter()});
}
function enter(){gate.hidden=true;gate.innerHTML="";document.body.classList.add("in");
  document.getElementById("who").textContent=`${me.name} · ${me.role==="admin"?"Admin":"Staff"}`;render()}
document.getElementById("signOut").addEventListener("click",()=>signOut("You have signed out."));
["click","keydown"].forEach(t=>document.addEventListener(t,()=>{if(me)touch()},true));
setInterval(()=>{if(me&&Date.now()-lastAct>IDLE_MIN*60e3)signOut(`Signed out after ${IDLE_MIN} minutes without activity.`)},30e3);
async function boot(){
  if(!(window.crypto&&crypto.subtle)){shell('<div class="msg err">This browser does not allow secure sign-in here. Open the page over https.</div>');return}
  await ensureUsers();restore();me&&!me.must?enter():showLogin();
}

// ----- Settings: accounts -----
let setMsg="";
function vAccounts(){
  const admin=me.role==="admin";
  return `<section class="sec"><h2>My account</h2>
   <form id="myPw"><div class="row" style="align-items:end">
    <label>Current password<input id="cp0" type="password" autocomplete="current-password" required></label>
    <label>New password<input id="cp1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirm new password<input id="cp2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="btn" type="submit">Change password</button></div></form><div id="myPwMsg"></div></section>
  ${admin?`<section class="sec"><h2>Users</h2>
   <div class="tbl"><table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
   ${U.map((u,i)=>`<tr><td class="num">${esc(u.u)}</td><td>${esc(u.name)}</td><td>${u.role==="admin"?"Admin":"Staff"}</td>
     <td class="sm">${u.must?'<span class="warn">Must set password at next sign-in</span>':'<span class="muted">Active</span>'}</td>
     <td><div class="acts" style="justify-content:flex-end"><input id="rp${i}" type="password" placeholder="Temporary password" style="width:170px" autocomplete="new-password">
      <button type="button" class="btn ghost sm" data-rp="${i}">Reset password</button>
      ${u.u!==me.u?`<button type="button" class="btn danger sm" data-du="${i}">Delete</button>`:""}</div></td></tr>`).join("")}
   </tbody></table></div>
   <form id="addUser" class="calc" style="display:block;margin-top:12px"><b style="font-family:var(--font-body)">Add a user</b>
    <div class="row" style="margin-top:8px">
     <label>Username<input id="nuU" required autocomplete="off"></label>
     <label>Full name<input id="nuN" required></label>
     <label>Role<select id="nuR"><option value="staff">Staff</option><option value="admin">Admin</option></select></label>
     <label>Temporary password<input id="nuP" type="password" minlength="8" required autocomplete="new-password"></label>
    </div><button class="btn" type="submit">Add user</button>
    <span class="sm muted">The new user sets their own password at first sign-in.</span></form>
   ${setMsg}</section>`:""}`;
}
function bindAccounts(){
  const g=id=>document.getElementById(id);
  g("myPw").addEventListener("submit",async e=>{e.preventDefault();const out=g("myPwMsg");
    if(await sha(me.salt+g("cp0").value)!==me.h)return out.innerHTML='<div class="msg err">Current password is wrong.</div>';
    if(g("cp1").value.length<8)return out.innerHTML='<div class="msg err">Use at least 8 characters.</div>';
    if(g("cp1").value!==g("cp2").value)return out.innerHTML='<div class="msg err">The new passwords do not match.</div>';
    await setPw(me,g("cp1").value);me.must=false;saveUsers();g("myPw").reset();out.innerHTML='<div class="msg ok">Password changed.</div>'});
  if(me.role!=="admin")return;
  const done=t=>{setMsg=t;saveUsers();render()};
  g("addUser").addEventListener("submit",async e=>{e.preventDefault();
    const u=g("nuU").value.trim().toLowerCase();
    if(!/^[a-z0-9._-]{2,}$/.test(u))return done('<div class="msg err">Username needs at least 2 characters: letters, digits, dot, dash or underscore.</div>');
    if(U.some(x=>x.u===u))return done(`<div class="msg err">Username ${esc(u)} already exists.</div>`);
    if(g("nuP").value.length<8)return done('<div class="msg err">Temporary password needs at least 8 characters.</div>');
    U.push(await mkUser(u,g("nuN").value.trim(),g("nuR").value,g("nuP").value));done(`<div class="msg ok">Added ${esc(u)}.</div>`)});
  app.querySelectorAll("[data-rp]").forEach(b=>b.addEventListener("click",async()=>{const i=+b.dataset.rp,pw=g("rp"+i).value;
    if(pw.length<8)return done('<div class="msg err">Type a temporary password of at least 8 characters next to the user first.</div>');
    await setPw(U[i],pw);U[i].must=true;done(`<div class="msg ok">Password reset for ${esc(U[i].u)}. They must set a new one at next sign-in.</div>`)}));
  app.querySelectorAll("[data-du]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.du,u=U[i];
    if(u.role==="admin"&&U.filter(x=>x.role==="admin").length<2)return done('<div class="msg err">Keep at least one admin.</div>');
    if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Click again to delete";return}
    U.splice(i,1);done(`<div class="msg ok">Deleted ${esc(u.u)}.</div>`)}));
}

boot();
</script>
